name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run repository verifier
        run: npm run verify

      - name: Run ingestion smoke test
        run: npm run smoke

      - name: Built-dist startup smoke (/health + /ready)
        shell: bash
        env:
          PORT: "4517"
          HOST: 127.0.0.1
          ASSINI_DB_PATH: ${{ runner.temp }}/ci-smoke-db.json
        run: |
          node apps/api/dist/index.js &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:4517/health" >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Built dist server never answered /health" >&2
            exit 1
          fi
          curl -fsS "http://127.0.0.1:4517/health"
          curl -fsS "http://127.0.0.1:4517/ready"

      - name: Audit dependencies
        run: npm audit --audit-level=moderate
