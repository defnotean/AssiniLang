name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint source
        run: npm run lint

      - name: Verify formatting
        run: npm run format:check

      - name: Typecheck and build web assets
        run: npm run build

      - name: Install Chromium for browser quality checks (Linux)
        if: runner.os == 'Linux'
        run: npm run e2e:install:ci

      - name: Browser E2E and accessibility checks (Linux)
        if: runner.os == 'Linux'
        run: npm run e2e

      - name: Rendered web smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke:web:linux-ci

      - name: Rendered web smoke (Windows)
        if: runner.os == 'Windows'
        run: npm run smoke:web

      - name: Run repository verifier
        run: npm run verify

      - name: Enforce test coverage thresholds
        run: npm run test:coverage

      - name: Run ingestion smoke test
        run: npm run smoke

      - name: Run backup/restore smoke test
        run: npm run smoke:backup

      - name: Built-dist startup smoke (/health + /ready)
        shell: bash
        env:
          PORT: "4517"
          HOST: 127.0.0.1
          ASSINI_DB_PATH: ${{ runner.temp }}/ci-smoke-db.json
        run: |
          node apps/api/dist/index.js &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:4517/health" >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Built dist server never answered /health" >&2
            exit 1
          fi
          health_body="$(curl -fsS "http://127.0.0.1:4517/health")"
          ready_body="$(curl -fsS "http://127.0.0.1:4517/ready")"
          node -e 'const body=JSON.parse(process.argv[1]); if(body.ok!==true){console.error(body); process.exit(1)}' "$health_body"
          node -e 'const body=JSON.parse(process.argv[1]); if(body.ok!==true){console.error(body); process.exit(1)}; if(!body.checks?.storage?.ok){console.error(body); process.exit(1)}; if(!body.checks?.jobQueue?.ok){console.error(body); process.exit(1)}; if(!body.checks?.recovery?.ok){console.error(body); process.exit(1)}; if(typeof body.checks.jobQueue.pending!=="number"||typeof body.checks.jobQueue.active!=="number"){console.error(body); process.exit(1)}' "$ready_body"

      - name: Packaged desktop smoke (Windows)
        if: runner.os == 'Windows'
        run: npm run desktop:package:smoke:built

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Generate production dependency SBOM (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          npm sbom --sbom-format cyclonedx --omit dev > assini-sbom.cdx.json
          sha256sum assini-sbom.cdx.json > assini-sbom.cdx.json.sha256

      - name: Upload dependency SBOM (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-sbom-${{ github.sha }}
          path: |
            assini-sbom.cdx.json
            assini-sbom.cdx.json.sha256
          if-no-files-found: error
          retention-days: 30
