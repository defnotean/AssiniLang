name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build web assets
        run: npm run build

      - name: Rendered web smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke:web

      - name: Rendered web smoke (Windows)
        if: runner.os == 'Windows'
        run: npm run smoke:web

      - name: Run repository verifier
        run: npm run verify

      - name: Run ingestion smoke test
        run: npm run smoke

      - name: Run backup/restore smoke test
        run: npm run smoke:backup

      - name: Built-dist startup smoke (/health + /ready)
        shell: bash
        env:
          PORT: "4517"
          HOST: 127.0.0.1
          ASSINI_DB_PATH: ${{ runner.temp }}/ci-smoke-db.json
        run: |
          node apps/api/dist/index.js &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:4517/health" >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Built dist server never answered /health" >&2
            exit 1
          fi
          health_body="$(curl -fsS "http://127.0.0.1:4517/health")"
          ready_body="$(curl -fsS "http://127.0.0.1:4517/ready")"
          node -e 'const body=JSON.parse(process.argv[1]); if(body.ok!==true){console.error(body); process.exit(1)}' "$health_body"
          node -e 'const body=JSON.parse(process.argv[1]); if(body.ok!==true){console.error(body); process.exit(1)}; if(!body.checks?.storage?.ok){console.error(body); process.exit(1)}; if(!body.checks?.jobQueue?.ok){console.error(body); process.exit(1)}; if(typeof body.checks.jobQueue.pending!=="number"||typeof body.checks.jobQueue.active!=="number"){console.error(body); process.exit(1)}' "$ready_body"

      - name: Packaged desktop smoke (Windows)
        if: runner.os == 'Windows'
        run: npm run desktop:package:smoke:built

      - name: Audit dependencies
        run: npm audit --audit-level=moderate
